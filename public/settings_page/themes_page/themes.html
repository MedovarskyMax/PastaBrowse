<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="themes_style.css" type="text/css">
  <title>Settings</title>
</head>

<body>
  <div class="column">
    <div class="btn_container">
      <button class="themeBtn" id="greyBtn">Grey</button>
      <button class="themeBtn" id="redBtn">Red</button>
      <button class="themeBtn" id="greenBtn">Green</button>
      <button class="themeBtn" id="blueBtn">Blue</button>
      <button class="themeBtn" id="orangeBtn">Orange</button>
      <button class="themeBtn no_right_margin" id="darkBtn">Dark</button>
    </div>
    <div class="btn_container">
      <button class="themeBtn" id="bronzeBtn">Bronze</button>
      <button class="themeBtn" id="tealBtn">Teal</button>
      <button class="themeBtn" id="indigoBtn">Indigo</button>
      <button class="themeBtn" id="purpleBtn">Purple</button>
      <button class="themeBtn" id="pinkBtn">Pink</button>
      <button class="themeBtn no_right_margin" id="fGreenBtn">Forest Green</button>
    </div>
    <div class="flex">
      <div class="vertical_container">
        <div class="btn_container toggle_setting">
          <h3>Linear Gradient</h3>
          <label class="switch">
            <input type="checkbox" id="linearGradient">
            <span class="slider round"></span>
          </label>
        </div>
        <div class="btn_container toggle_setting">
          <h3>Auto Dark Mode</h3>
          <label class="switch">
            <input type="checkbox" id="autoDarkMode">
            <span class="slider round"></span>
          </label>
        </div>
        <div class="btn_container toggle_setting">
          <h3>RGB</h3>
          <label class="switch">
            <input type="checkbox" id="rgbCheck">
            <span class="slider round"></span>
          </label>
        </div>
      </div>
      <div class="vertical_container">
        <div class="custom_theme_container">
          <button class="custom_theme_btn">+</button>
          <button class="custom_theme_btn">+</button>
        </div>
        <div class="custom_theme_container">
          <button class="custom_theme_btn">+</button>
          <button class="custom_theme_btn">+</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="themes_main.js"></script>
</body>

</html>
